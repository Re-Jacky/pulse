name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'pulse.xcodeproj/project.pbxproj'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' pulse.xcodeproj/project.pbxproj | sed 's/.*= *//;s/;//')

          if [ -z "${VERSION}" ]; then
            echo "Failed to read MARKETING_VERSION" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dmg=dist/Pulse-${VERSION}.dmg" >> "$GITHUB_OUTPUT"
          echo "zip=dist/Pulse-${VERSION}-updater.zip" >> "$GITHUB_OUTPUT"

      - name: Validate pushed version changes
        id: guard
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"
          PROJECT_FILE="pulse.xcodeproj/project.pbxproj"

          if [ "$BEFORE_SHA" = "$ZERO_SHA" ]; then
            RANGE_COMMITS=$(git rev-list --reverse "$CURRENT_SHA")
            PREVIOUS_VERSION=""
          else
            RANGE_COMMITS=$(git rev-list --reverse "${BEFORE_SHA}..${CURRENT_SHA}")
            PREVIOUS_VERSION=$(git show "${BEFORE_SHA}:${PROJECT_FILE}" | grep -m1 'MARKETING_VERSION' | sed 's/.*= *//;s/;//' || true)
          fi

          if [ -z "$RANGE_COMMITS" ]; then
            echo "No commits found in push range; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          transitions=()
          last_seen_version="$PREVIOUS_VERSION"
          while IFS= read -r commit; do
            [ -n "$commit" ] || continue

            if ! git diff-tree --no-commit-id --name-only -r "$commit" | grep -qx "$PROJECT_FILE"; then
              continue
            fi

            version=$(git show "${commit}:${PROJECT_FILE}" | grep -m1 'MARKETING_VERSION' | sed 's/.*= *//;s/;//')
            [ -n "$version" ] || continue

            if [ "$version" != "$last_seen_version" ]; then
              transitions+=("$version")
              last_seen_version="$version"
            fi
          done <<< "$RANGE_COMMITS"

          if [ ${#transitions[@]} -eq 0 ]; then
            echo "MARKETING_VERSION did not change in this push; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ${#transitions[@]} -gt 1 ]; then
            printf 'Multiple MARKETING_VERSION transitions detected in one push: %s\n' "${transitions[*]}" >&2
            echo "Push version changes must include only one actual version bump." >&2
            exit 1
          fi

          if [ "${transitions[0]}" != "$CURRENT_VERSION" ]; then
            echo "Push changed MARKETING_VERSION to ${transitions[0]}, but HEAD is ${CURRENT_VERSION}." >&2
            echo "Keep release pushes linear so the final version matches the released version." >&2
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "pushed_version=${transitions[0]}" >> "$GITHUB_OUTPUT"

      - name: Show resolved release values
        shell: bash
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Tag: ${{ steps.version.outputs.tag }}"
          echo "DMG: ${{ steps.version.outputs.dmg }}"
          echo "ZIP: ${{ steps.version.outputs.zip }}"
          echo "Should Release: ${{ steps.guard.outputs.should_release }}"

      - name: Skip if version was not bumped in this push
        if: steps.guard.outputs.should_release != 'true'
        shell: bash
        run: |
          echo "No releasable version bump detected in this push."

      - name: Fail if release already exists
        if: steps.guard.outputs.should_release == 'true'
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists" >&2
            exit 1
          fi

      - name: Generate release notes
        id: release_notes
        if: steps.guard.outputs.should_release == 'true'
        shell: bash
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "${PREVIOUS_TAG}..HEAD" --format='- %s (%h)'
            else
              git log HEAD --format='- %s (%h)'
            fi
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ steps.version.outputs.tag }}"
            fi
          } > "$NOTES_FILE"

          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Show generated release notes
        if: steps.guard.outputs.should_release == 'true'
        shell: bash
        run: cat "${{ steps.release_notes.outputs.notes_file }}"

      - name: Build release artifacts
        if: steps.guard.outputs.should_release == 'true'
        shell: bash
        run: bash scripts/build-dmg.sh

      - name: Verify release artifacts exist
        if: steps.guard.outputs.should_release == 'true'
        shell: bash
        run: |
          if [ ! -f "${{ steps.version.outputs.dmg }}" ]; then
            echo "Missing DMG artifact: ${{ steps.version.outputs.dmg }}" >&2
            exit 1
          fi

          if [ ! -f "${{ steps.version.outputs.zip }}" ]; then
            echo "Missing updater ZIP artifact: ${{ steps.version.outputs.zip }}" >&2
            exit 1
          fi

          ls -lh "${{ steps.version.outputs.dmg }}" "${{ steps.version.outputs.zip }}"

      - name: Create GitHub Release
        if: steps.guard.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.dmg }}" \
            "${{ steps.version.outputs.zip }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Pulse ${{ steps.version.outputs.version }}" \
            --notes-file "${{ steps.release_notes.outputs.notes_file }}"

      - name: Write workflow summary
        shell: bash
        run: |
          {
            if [ "${{ steps.guard.outputs.should_release }}" = "true" ]; then
              echo "## Release Published"
            else
              echo "## Release Skipped"
            fi
            echo ""
            echo "- Version: ${{ steps.version.outputs.version }}"
            echo "- Tag: ${{ steps.version.outputs.tag }}"
            echo "- Should Release: ${{ steps.guard.outputs.should_release }}"
            if [ "${{ steps.guard.outputs.should_release }}" = "true" ]; then
              echo "- Previous Tag: ${{ steps.release_notes.outputs.previous_tag || 'none' }}"
              echo "- DMG: ${{ steps.version.outputs.dmg }}"
              echo "- ZIP: ${{ steps.version.outputs.zip }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
